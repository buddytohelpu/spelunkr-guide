name: Check and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:roku

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak librsvg2-common appstream
      - name: Validate application metadata
        run: appstreamcli validate --no-net clients/linux/io.github.buddy.SpelunkrGuide.metainfo.xml
      - name: Build Flatpak bundle
        run: python3 scripts/package-flatpak.py
      - uses: actions/upload-artifact@v4
        with:
          name: spelunkr-guide-linux-x86_64
          path: dist/spelunkr-guide-x86_64.flatpak
          if-no-files-found: error
