name: Check and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:roku

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak librsvg2-common appstream
      - name: Validate application metadata
        run: appstreamcli validate --no-net clients/linux/io.github.buddy.SpelunkrGuide.metainfo.xml
      - name: Build Flatpak bundle
        run: python3 scripts/package-flatpak.py
      - uses: actions/upload-artifact@v4
        with:
          name: spelunkr-guide-linux-x86_64
          path: dist/spelunkr-guide-x86_64.flatpak
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android fullscreen, Back, rotation and picture setting
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: cd clients/android && ./gradlew connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-results
          path: clients/android/app/build/reports/androidTests/connected/
