plugins { id 'com.android.application' }

android {
    namespace 'io.github.buddy.spelunkrguide'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.buddy.spelunkrguide'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        localRelease {
            def signingFile = System.getenv('SPELUNKR_KEYSTORE_FILE')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('SPELUNKR_STORE_PASSWORD')
                keyAlias 'spelunkr'
                keyPassword System.getenv('SPELUNKR_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.localRelease
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/web-assets')
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.register('syncWebAssets', Sync) {
    from('../../../web') { into 'web' }
    from '../../../PROVENANCE.md'
    into layout.buildDirectory.dir('generated/web-assets')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
